name: Test Text-to-Video Generator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run syntax check
      run: |
        python -m py_compile main.py
        python -m py_compile advanced_generator.py
        python -m py_compile web_interface.py
        python -m py_compile run_all.py
    
    - name: Verify imports
      run: |
        python -c "from main import TextToVideoGenerator; print('[OK] main.py imports successfully')"
        python -c "from advanced_generator import AdvancedTextToVideoGenerator; print('[OK] advanced_generator.py imports successfully')"
        python -c "from web_interface import VideoGeneratorInterface; print('[OK] web_interface.py imports successfully')"
